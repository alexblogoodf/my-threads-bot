name: Threads Auto Poster

on:
  schedule:
    # Запуск каждые 8 часов (в 00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой в интерфейсе GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: разрешение на запись обратно в репозиторий (state.json)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run publishing script
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python publish.py

      - name: Save updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update next post index in state.json" && git push)
